[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "counter-uas-sim"
version = "1.1.0"
description = "Counter-UAS defence simulation for research and education: detection, tracking, threat assessment, and low-cost interceptor engagement analysis"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Sajid Kabir Saji" }]
requires-python = ">=3.10"
dependencies = ["numpy"]
keywords = ["counter-uas", "air-defence", "simulation", "kalman-filter", "proportional-navigation"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Physics",
]

[project.urls]
Homepage = "https://github.com/sajidkabir/counter-uas-sim"
Repository = "https://github.com/sajidkabir/counter-uas-sim"
Issues = "https://github.com/sajidkabir/counter-uas-sim/issues"
Changelog = "https://github.com/sajidkabir/counter-uas-sim/blob/main/CHANGELOG.md"

[project.scripts]
counter-uas = "counter_uas_sim.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/counter_uas_sim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
